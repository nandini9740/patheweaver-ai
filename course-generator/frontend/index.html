<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathweaver AI | Personalized Learning Roadmaps</title>
    <meta name="description" content="Generate expert-curated and AI-driven learning paths tailored to your skill level, goals, and schedule.">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-ornament"></div>
    <div class="container">
        <header>
            <div class="logo">Pathweaver<span>AI</span></div>
            <h1>Master Any Skill</h1>
            <p>Your personalized, goal-driven learning roadmap.</p>
        </header>

        <main>
            <section class="input-section" id="input-section">
                <form id="course-form">
                    <div class="form-group">
                        <label for="topic">Topic</label>
                        <input type="text" id="topic" placeholder="e.g. Machine Learning, Python, DSA" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="skill_level">Skill Level</label>
                            <select id="skill_level" required>
                                <option value="beginner">Beginner</option>
                                <option value="intermediate">Intermediate</option>
                                <option value="advanced">Advanced</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="hours_per_week">Hours / Week</label>
                            <input type="number" id="hours_per_week" min="1" max="40" value="5" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="learning_style">Learning Style</label>
                            <select id="learning_style" required>
                                <option value="hands-on">Hands-on / Project-based</option>
                                <option value="theoretical">Theoretical / Deep-dive</option>
                                <option value="visual">Visual / Interactive</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="goal">Learning Goal</label>
                        <input type="text" id="goal" placeholder="e.g. Get a job, build a specific project, pass exam" required>
                    </div>

                    <button type="submit" id="generate-btn" class="primary-btn">
                        <span class="btn-text">Generate Roadmap</span>
                        <div class="loader hidden" id="btn-loader"></div>
                    </button>
                </form>

                <div id="recent-courses-section" class="recent-courses-section hidden">
                    <h3>Recent Roadmaps</h3>
                    <div id="recent-courses-list" class="recent-courses-list">
                        <!-- Recent courses will be injected here -->
                    </div>
                </div>
            </section>

            <section class="output-section hidden" id="output-section">
                <div id="fallback-warning" class="warning-banner hidden">
                    <span class="warning-icon">⚠️</span>
                    <div class="warning-text">
                        <strong>AI Quota Exceeded:</strong> Using a basic roadmap template. Please check your Gemini API key or try again later for a fully personalized AI roadmap.
                    </div>
                </div>
                <div class="roadmap-header">
                    <h2 id="course-title">Course Title</h2>
                    <p id="course-overview" class="overview"></p>
                    <div class="duration-badge" id="course-duration"></div>
                </div>

                <div class="modules-container" id="modules-container">
                    <!-- Modules will be injected here -->
                </div>

                <div class="export-actions">
                    <button id="download-json" class="secondary-btn">Download JSON</button>
                    <button id="download-pdf" class="secondary-btn">Download PDF</button>
                    <button id="share-roadmap" class="secondary-btn">Share Roadmap</button>
                    <button id="start-over" class="outline-btn">Create New</button>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
